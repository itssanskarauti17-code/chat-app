<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Boat | Alex & Kitty</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

<div class="chat-wrapper">

    <!-- HEADER -->
    <header class="chat-header">
        <div class="user-info">
            <h2 id="partner-name" class="partner-title">Loading...</h2>
            <span id="status-text" class="status">offline</span>
        </div>

        <div class="header-actions">
            

            <!-- Audio Call -->
            <div class="call-btn" id="audioCallBtn" title="Audio Call">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#075E54">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
                </svg>
            </div>

            <!-- Video Call -->
            <div class="call-btn" id="videoCallBtn" title="Video Call">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#075E54">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"></path>
                </svg>
            </div>

        </div>
    </header>

    <!-- CHAT BOX -->
    <div id="chat-box" class="chat-box">

        <!-- Messages will appear here -->

        <!-- Typing indicator -->
        <div id="typing-area" style="font-size:12px;color:gray;margin-top:5px;"></div>

    </div>

    <!-- FOOTER -->
    <footer class="chat-footer">

        <!-- FILE -->
        <label for="file-input" class="icon-btn left-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="#075E54">
                <path d="M19.75 2H4.25C3.01 2 2 3.01 2 4.25v15.5C2 20.99 3.01 22 4.25 22h15.5c1.24 0 2.25-1.01 2.25-2.25V4.25C22 3.01 20.99 2 19.75 2zM4.25 3.5h15.5c.41 0 .75.34.75.75v10.12l-3.12-3.12a2.25 2.25 0 00-3.18 0L9.75 15.75l-2.12-2.12a2.25 2.25 0 00-3.18 0L3.5 14.56V4.25c0-.41.34-.75.75-.75zm15.5 17H4.25a.75.75 0 01-.75-.75v-4.31l3.12-3.12a.75.75 0 011.06 0l2.12 2.12a.75.75 0 001.06 0l4.5-4.5a.75.75 0 011.06 0l3.12 3.12v6.69a.75.75 0 01-.75.75z"></path>
            </svg>
        </label>

        <input type="file" id="file-input" hidden accept="image/*,video/*">

        <!-- INPUT -->
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">

        <!-- RIGHT ACTIONS -->
        <div class="right-actions">

            <!-- EMOJI -->
            <div id="emoji-btn" class="icon-btn">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="#075E54">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"></path>
                </svg>
            </div>

            <!-- SEND -->
            <div id="send-btn" class="insta-send">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="#075E54">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path>
                </svg>
            </div>

        </div>

    </footer>

</div>

<!-- SOCKET -->
<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
<script src="call.js"></script>
<!-- CALL POPUP -->
<div id="callPopup" class="call-popup">

    <p id="callText">Incoming Call...</p>

    <div class="call-actions">

        <button id="acceptCallBtn" class="accept-btn">
            Accept
        </button>

        <button id="rejectCallBtn" class="reject-btn">
            Reject
        </button>

    </div>

</div>
<script>
  // Mobile Viewport Height Fix
  function adjustHeight() {
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }
  window.addEventListener('resize', adjustHeight);
  window.addEventListener('orientationchange', adjustHeight);
  adjustHeight();
  
</script>
<script>
  // Click on any image in chat to open it
  document.getElementById('chat-box').addEventListener('click', function(e) {
    if (e.target.tagName === 'IMG') {
      window.open(e.target.src, '_blank');
    }
  });

  // Cursor change for images
  const style = document.createElement('style');
  style.innerHTML = '#chat-box img { cursor: zoom-in; }';
  document.head.appendChild(style);
</script>
</body>
